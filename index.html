<!-- START: Open-in-browser visual hint (TikTok & Instagram) -->
<style>
/* Container */
.oib2-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.55);
  backdrop-filter: blur(6px) saturate(0.9);
  z-index: 99999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  -webkit-tap-highlight-color: transparent;
}

/* small mock browser window */
.oib2-mock {
  width: min(86%,420px);
  height: 210px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.45);
  position: relative;
  overflow: hidden;
}

/* top toolbar inside mock */
.oib2-toolbar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: rgba(250,250,250,0.98);
  border-bottom: 1px solid rgba(0,0,0,0.03);
}
.oib2-toolbar .left {
  display:flex;
  gap:8px;
  align-items:center;
}
.oib2-toolbar .left .icon {
  width:28px;height:28px;border-radius:6px;background:transparent;display:flex;align-items:center;justify-content:center;color:#222;font-weight:700;font-size:18px;
}
.oib2-toolbar .right .dots {
  width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#222;font-size:18px;
}

/* arrow pointing to dots */
.oib2-arrow {
  position: absolute;
  right: 26px; /* aligns with dots */
  top: 38px;
  width: 90px;
  height: 90px;
  pointer-events: none;
  transform: rotate(8deg);
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
}

/* instruction card (big) */
.oib2-instruction {
  width: min(92%,640px);
  max-width: 760px;
  background: #ffffff;
  color: #0b1220;
  border-radius: 12px;
  padding: 20px 22px;
  margin-top: 18px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  text-align: center;
  font-weight: 700;
  font-size: 18px;
  line-height: 1.25;
}

/* small helper row with button */
.oib2-actions {
  margin-top: 12px;
  display:flex;
  gap:10px;
  justify-content:center;
  align-items:center;
}
.oib2-btn {
  padding:10px 14px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:700;
}
.oib2-btn.primary { background:#06f; color:#fff; }
.oib2-btn.ghost { background:transparent; color:#0b1220; border:1px solid rgba(11,18,32,0.08); }

/* Responsive smaller text on tiny screens */
@media (max-width:360px) {
  .oib2-instruction { font-size:16px; padding:14px; }
  .oib2-mock { height:170px; }
}
</style>

<div id="oib2" class="oib2-overlay" role="dialog" aria-modal="true" aria-labelledby="oib2-title" aria-hidden="true">
  <div style="display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:820px;">
    <!-- mock in-app browser -->
    <div class="oib2-mock" aria-hidden="true">
      <div class="oib2-toolbar">
        <div class="left">
          <div class="icon" aria-hidden="true">‹</div>
          <div class="icon" aria-hidden="true">×</div>
        </div>
        <div class="right">
          <div class="dots" aria-hidden="true">⋯</div>
        </div>
      </div>
      <!-- blank content area (just visual) -->
      <div style="height:calc(100% - 44px); background:linear-gradient(180deg,#ffffff,#f6f7f9);"></div>
      <!-- arrow SVG -->
      <svg class="oib2-arrow" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10 54 L40 28 L48 20 L60 12" stroke="#ff3b30" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M58 10 L64 10 L64 16" stroke="#ff3b30" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- instruction bubble -->
    <div class="oib2-instruction" id="oib2-title">
      Please click the three dots menu (⋯) at the top-right and choose "Open in browser" to download files or access full features.
      <div class="oib2-actions">
        <button class="oib2-btn primary" id="oib2-open">Got it, I opened</button>
        <button class="oib2-btn ghost" id="oib2-close">Stay here</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var ua = navigator.userAgent || navigator.vendor || window.opera || '';
  var isTikTok = /tiktok|musical_ly|com\.zhiliaoapp/i.test(ua);
  var isInstagram = /instagram|fb_iab|instagram_for/i.test(ua);
  if (!isTikTok && !isInstagram) return; // show only for TikTok/Instagram webviews

  var KEY = 'oib2_shown_v1';
  var TTL = 7 * 24 * 60 * 60 * 1000; // 7 days

  try {
    var last = localStorage.getItem(KEY);
    if (last && (Date.now() - parseInt(last,10) < TTL)) {
      return;
    }
  } catch(e){ /* ignore storage errors */ }

  var overlay = document.getElementById('oib2');
  if (!overlay) return;
  overlay.style.display = 'flex';
  overlay.setAttribute('aria-hidden','false');

  var openBtn = document.getElementById('oib2-open');
  var closeBtn = document.getElementById('oib2-close');

  function hide() {
    overlay.style.display = 'none';
    overlay.setAttribute('aria-hidden','true');
    try { localStorage.setItem(KEY, String(Date.now())); } catch(e){ }
  }

  closeBtn.addEventListener('click', hide);
  // user clicked "Got it" — simply hide (they will follow instructions manually)
  openBtn.addEventListener('click', hide);

  // close also on Esc or tap outside mock/instruction
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hide(); });
  overlay.addEventListener('click', function(e){
    if (e.target === overlay) hide();
  });

  // Optional: personalize text by app
  var desc = document.getElementById('oib2-title');
  if (desc) {
    if (isTikTok) desc.firstChild.nodeValue = desc.firstChild.nodeValue; // keep default or change if needed
  }
})();
</script>
<!-- END: Open-in-browser visual hint -->
