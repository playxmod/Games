<!-- START: Read-only instruction overlay (Arabic) -->
<style>
/* Overlay */
.oib_readonly {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.62);
  backdrop-filter: blur(5px) brightness(0.9);
  z-index: 999999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  -webkit-tap-highlight-color: transparent;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

/* inner */
.oib_box {
  width: min(94%, 820px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}

/* mock toolbar */
.oib_browser {
  width: min(420px, 86%);
  border-radius:14px;
  background: linear-gradient(#fff,#f7f8fb);
  box-shadow: 0 24px 48px rgba(0,0,0,0.45);
  position: relative;
  overflow: visible;
  border: 1px solid rgba(0,0,0,0.06);
}
.oib_toolbar {
  height:46px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 10px;
  background:#f6f7f9;
  color:#111;
  font-weight:700;
}
.oib_toolbar .left { display:flex; gap:8px; align-items:center; }
.oib_toolbar .right { display:flex; gap:8px; align-items:center; }
.oib_toolbar .dots {
  font-size:22px;
  padding:6px;
  border-radius:8px;
  background:transparent;
  user-select:none;
}

/* content area */
.oib_content {
  height:150px;
  background: linear-gradient(180deg,#fff,#f0f4fb);
}

/* red arrow (absolute) */
.oib_arrow {
  position:absolute;
  right:18px;
  top:-24px;
  width:96px;
  height:96px;
  pointer-events:none;
  transform: rotate(8deg);
  animation: oib_arrow_bob 1.3s ease-in-out infinite;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.28));
}
@keyframes oib_arrow_bob {
  0% { transform: translateY(0) rotate(8deg); }
  50% { transform: translateY(-10px) rotate(8deg); }
  100% { transform: translateY(0) rotate(8deg); }
}

/* instruction card */
.oib_text {
  max-width: 760px;
  background: #fff;
  padding: 18px 20px;
  border-radius: 12px;
  box-shadow: 0 18px 36px rgba(0,0,0,0.28);
  text-align: center;
  font-weight:800;
  font-size:18px;
  color:#0a1220;
  line-height:1.25;
}

/* secure badge */
.oib_secure {
  margin-top:10px;
  display:inline-flex;
  align-items:center;
  gap:10px;
  background: rgba(6,176,90,0.12);
  color:#056d3a;
  padding:8px 14px;
  border-radius:28px;
  font-weight:700;
  box-shadow: 0 8px 18px rgba(0,0,0,0.12);
}

/* close small button (optional) */
.oib_close {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(255,255,255,0.9);
  border: none;
  border-radius: 8px;
  padding:6px 8px;
  cursor:pointer;
  font-weight:700;
  box-shadow: 0 6px 14px rgba(0,0,0,0.12);
}

/* responsiveness */
@media (max-width:420px){
  .oib_text { font-size:16px; padding:14px; }
  .oib_arrow { width:72px; height:72px; top:-18px; right:12px; }
}
</style>

<div id="oib_readonly" class="oib_readonly" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="oib_box" role="document">
    <div class="oib_browser" aria-hidden="true">
      <button class="oib_close" id="oib_readonly_close" aria-label="Close" title="Close">×</button>

      <div class="oib_toolbar">
        <div class="left"><span style="font-size:20px">←</span><span style="font-size:16px">×</span></div>
        <div class="right"><div class="dots" aria-hidden="true">⋯</div></div>
      </div>

      <div class="oib_content"></div>

      <!-- arrow SVG -->
      <svg class="oib_arrow" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M8 56 L38 30 L46 22 L58 14" stroke="#ff3b30" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M56 12 L62 12 L62 18" stroke="#ff3b30" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="oib_text" id="oib_readonly_text">
      اضغط الثلاث نقاط (⋯) في أعلى يمين تطبيق TikTok ثم اختر "Open in browser" أو "فتح في المتصفح" لعرض الصفحة كاملةً والتمكن من التحميل.
      <div class="oib_secure" aria-hidden="true" style="margin-top:12px">
        <!-- simple check icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="vertical-align:middle" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2l7 3v5c0 5-3 9-7 11-4-2-7-6-7-11V5l7-3z" fill="#06c26c"/>
          <path d="M9.5 12.5l1.8 1.8L15 10" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Secure • Verified by Play Protect
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // helper: force show for testing with ?show_oib=1
  function qsBool(name){ var m = location.search.match(new RegExp('[?&]'+name+'=(1|true)')); return !!m; }

  var ua = navigator.userAgent || navigator.vendor || window.opera || '';
  var isTikTok = /tiktok|musical_ly|com\.zhiliaoapp|zhiliaoapp/i.test(ua);
  var isInstagram = /instagram|fb_iab|instagram_for/i.test(ua);
  var forced = qsBool('show_oib') || qsBool('oib');

  // Show only in TikTok/Instagram webviews unless forced
  if (!isTikTok && !isInstagram && !forced) return;

  document.addEventListener('DOMContentLoaded', function(){
    var overlay = document.getElementById('oib_readonly');
    var close = document.getElementById('oib_readonly_close');
    if (!overlay) return;

    // show overlay automatically
    setTimeout(function(){
      overlay.style.display = 'flex';
      overlay.setAttribute('aria-hidden','false');
    }, 80);

    // close handler (optional; visitor can close)
    if (close) {
      close.addEventListener('click', function(e){
        e.stopPropagation();
        overlay.style.display = 'none';
        overlay.setAttribute('aria-hidden','true');
      });
    }

    // also allow closing by tapping outside the box
    overlay.addEventListener('click', function(e){
      if (e.target === overlay) {
        overlay.style.display = 'none';
        overlay.setAttribute('aria-hidden','true');
      }
    });

    // prevent background scrolling on touch devices while overlay visible
    overlay.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });
  });
})();
</script>
<!-- END: Read-only instruction overlay -->
