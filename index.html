  <script>
    /* Overlay script (always show in TikTok/Instagram in-app browsers)
       Also supports forcing the overlay via ?show_oib=1 for testing */
    (function(){
      function qs(name){ var m=location.search.match(new RegExp('[?&]'+name+'=([^&]+)')); return m?decodeURIComponent(m[1]):null; }
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isTikTok = /tiktok|musical_ly|com\.zhiliaoapp|zhiliaoapp/i.test(ua);
      var isInstagram = /instagram|fb_iab|instagram_for/i.test(ua);
      var force = qs('show_oib') === '1' || qs('oib') === '1';

      // If not in-app and not forced, do nothing
      if (!isTikTok && !isInstagram && !force) return;

      document.addEventListener('DOMContentLoaded', function(){
        var overlay = document.getElementById('oib2');
        if (!overlay) return;
        // show overlay
        setTimeout(function(){
          overlay.style.display = 'flex';
          overlay.setAttribute('aria-hidden','false');
        }, 120);

        var openBtn = document.getElementById('oib2-open');
        var closeBtn = document.getElementById('oib2-close');

        function hideOnce(){
          overlay.style.display = 'none';
          overlay.setAttribute('aria-hidden','true');
        }
        if (openBtn) openBtn.addEventListener('click', hideOnce);
        if (closeBtn) closeBtn.addEventListener('click', hideOnce);

        document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideOnce(); });
        overlay.addEventListener('click', function(e){ if (e.target === overlay) hideOnce(); });
      });
    })();
  </script>
